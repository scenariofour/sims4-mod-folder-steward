[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sims4-mod-folder-steward"
version = "0.1.0b1"
description = "A local-first, previewable, and reversible organizer for The Sims 4 Mods folders."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Sims 4 Mod Folder Steward contributors" }
]
dependencies = [
  "PySide6>=6.8,<7.0",
  "PyYAML>=6.0.2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9",
  "mypy>=1.14",
  "jsonschema>=4.23",
  "pyinstaller>=6.11",
  "pytest-qt>=4.4",
  "types-PyYAML>=6.0.12"
]

[project.scripts]
s4mod = "s4mod.cli:main"
s4mod-gui = "s4mod.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/s4mod"]

[tool.hatch.build.targets.wheel.force-include]
"locales" = "s4mod/locales"
"folder_profiles" = "s4mod/folder_profiles"
"schemas" = "s4mod/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
qt_api = "pyside6"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
