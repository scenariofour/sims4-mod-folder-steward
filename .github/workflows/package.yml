name: package-desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: pyinstaller --noconfirm --clean packaging/s4mod-steward.spec
      - name: Smoke test macOS app
        if: runner.os == 'macOS'
        run: S4MOD_SMOKE_TEST=1 ./dist/S4ModSteward.app/Contents/MacOS/S4ModSteward
      - name: Smoke test Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:S4MOD_SMOKE_TEST = '1'
          .\dist\S4ModSteward\S4ModSteward.exe
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/S4ModSteward.app S4ModSteward-macOS.zip
          shasum -a 256 S4ModSteward-macOS.zip > S4ModSteward-macOS.zip.sha256
      - name: Archive Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path dist\S4ModSteward -DestinationPath S4ModSteward-Windows.zip
          $hash = (Get-FileHash S4ModSteward-Windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  S4ModSteward-Windows.zip" | Set-Content S4ModSteward-Windows.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: S4ModSteward-${{ runner.os }}
          path: |
            S4ModSteward-*.zip
            S4ModSteward-*.zip.sha256
